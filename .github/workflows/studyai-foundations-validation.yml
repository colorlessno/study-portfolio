name: StudyAI foundations validation

on:
  push:
    paths:
      - "StudyAI/**"
      - ".github/workflows/studyai-foundations-validation.yml"
  pull_request:
    paths:
      - "StudyAI/**"
      - ".github/workflows/studyai-foundations-validation.yml"

permissions:
  contents: read

concurrency:
  group: studyai-foundations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ai-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency-free AI learning validation
        run: python StudyAI/scripts/validate-ai-learning.py
